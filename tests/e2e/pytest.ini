[pytest]
# `client.py` sits next to the tests and is imported by name. pytest's default
# "prepend" import mode already puts the conftest directory on sys.path, so no
# `pythonpath` setting is needed — and that key does not exist before pytest 7,
# where it would only produce a warning.
testpaths = .
python_files = test_*.py
addopts = -v --strict-markers
markers =
    slow: takes more than a second (concurrency and load-shaped tests)
